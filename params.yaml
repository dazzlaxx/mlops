ingest:
  source: data/external/california_housing.csv
  latitude_threshold: 35.0
  version: north
data:
  raw: data/raw/housing.csv
  target: MedHouseVal
  drop: []
  test_size: 0.2
  split_by_time: false
train:
  model: gradient_boosting
  n_estimators: 600
  max_depth: 6
  min_samples_leaf: 3
  learning_rate: 0.05
  seed: 42
evaluate:
  min_r2: 0.6
mlflow:
  experiment: california-housing
  model_name: california-housing-regressor
  primary_metric: r2
