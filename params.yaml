ingest:
  source: data/external/california_housing.csv
  latitude_threshold: 35.0
  version: north

data:
  raw: data/raw/housing.csv
  target: MedHouseVal
  drop: []
  test_size: 0.2
  split_by_time: false

train:
  model: gradient_boosting
  n_estimators: 500
  max_depth: 4
  min_samples_leaf: 2
  learning_rate: 0.1
  seed: 42

evaluate:
  min_r2: 0.60
